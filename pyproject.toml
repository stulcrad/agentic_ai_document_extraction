[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"] # E: pycodestyle errors, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that need a running Ollama server",
]
filterwarnings = ["ignore::UserWarning:starlette.*"]
